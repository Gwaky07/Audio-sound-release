[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-sound"
version = "0.5.1"
description = "Standalone Codex-triggered audio processing pipeline."
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = []

[project.scripts]
audio-cleanup = "audio_sound.cli:main"
audio-skill-workflow = "audio_sound.skill_workflow:main"
audio-remove-segments = "audio_sound.segment_removal:main"
audio-audit-release = "audio_sound.release_audit:main"
audio-verify-delivery = "audio_sound.delivery_verifier:main"

[tool.setuptools]
packages = ["audio_sound", "audio_sound.presets"]

[tool.setuptools.package-data]
"audio_sound.presets" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "output", "scratch", "tools"]
