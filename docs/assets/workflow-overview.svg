<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Audio-sound workflow overview</title>
  <desc id="desc">A complete workflow from source media through diagnosis, audio repair, spoken-word cuts, verification, and delivery.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".32"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <circle cx="1090" cy="72" r="150" fill="#2563eb" opacity=".12"/>
  <circle cx="90" cy="390" r="170" fill="#0ea5e9" opacity=".08"/>

  <text x="60" y="68" fill="#f8fafc" font-size="34" font-weight="700" font-family="Arial, sans-serif">Audio-sound Spoken-word Workflow</text>
  <text x="60" y="103" fill="#94a3b8" font-size="19" font-family="Arial, sans-serif">Audio repair - denoise - word and sentence cuts - seam repair - release verification</text>
  <rect x="60" y="124" width="1080" height="4" rx="2" fill="url(#accent)"/>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(60 168)">
      <rect width="190" height="154" rx="18" fill="#1e293b" stroke="#334155"/>
      <circle cx="34" cy="34" r="18" fill="#0ea5e9"/>
      <text x="34" y="41" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">1</text>
      <text x="24" y="78" fill="#f8fafc" font-size="23" font-weight="700">Source</text>
      <text x="24" y="110" fill="#94a3b8" font-size="17">WAV / MP3 / video</text>
      <text x="24" y="136" fill="#94a3b8" font-size="17">Preserve media format</text>
    </g>

    <g transform="translate(280 168)">
      <rect width="190" height="154" rx="18" fill="#1e293b" stroke="#334155"/>
      <circle cx="34" cy="34" r="18" fill="#0284c7"/>
      <text x="34" y="41" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">2</text>
      <text x="24" y="78" fill="#f8fafc" font-size="23" font-weight="700">Diagnose</text>
      <text x="24" y="110" fill="#94a3b8" font-size="17">Noise / breath / clipping</text>
      <text x="24" y="136" fill="#94a3b8" font-size="17">Plan safe candidates</text>
    </g>

    <g transform="translate(500 168)">
      <rect width="200" height="154" rx="18" fill="#1e293b" stroke="#334155"/>
      <circle cx="34" cy="34" r="18" fill="#2563eb"/>
      <text x="34" y="41" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">3</text>
      <text x="24" y="78" fill="#f8fafc" font-size="23" font-weight="700">Repair</text>
      <text x="24" y="110" fill="#94a3b8" font-size="17">Breath / EQ / de-ess</text>
      <text x="24" y="136" fill="#94a3b8" font-size="17">Level / denoise / protect</text>
    </g>

    <g transform="translate(730 168)">
      <rect width="190" height="154" rx="18" fill="#1e293b" stroke="#334155"/>
      <circle cx="34" cy="34" r="18" fill="#4f46e5"/>
      <text x="34" y="41" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">4</text>
      <text x="24" y="78" fill="#f8fafc" font-size="23" font-weight="700">Cut and Join</text>
      <text x="24" y="110" fill="#94a3b8" font-size="17">Words / sentences</text>
      <text x="24" y="136" fill="#94a3b8" font-size="17">Fade / safe pause</text>
    </g>

    <g transform="translate(950 168)">
      <rect width="190" height="154" rx="18" fill="#1e293b" stroke="#334155"/>
      <circle cx="34" cy="34" r="18" fill="#7c3aed"/>
      <text x="34" y="41" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">5</text>
      <text x="24" y="78" fill="#f8fafc" font-size="23" font-weight="700">Verify</text>
      <text x="24" y="110" fill="#94a3b8" font-size="17">Quality gates / SHA-256</text>
      <text x="24" y="136" fill="#94a3b8" font-size="17">WAV + MP3 + reports</text>
    </g>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round">
    <path d="M252 245h20"/>
    <path d="M472 245h20"/>
    <path d="M702 245h20"/>
    <path d="M922 245h20"/>
  </g>
  <g fill="#94a3b8">
    <path d="M272 245l-9-6v12z"/>
    <path d="M492 245l-9-6v12z"/>
    <path d="M722 245l-9-6v12z"/>
    <path d="M942 245l-9-6v12z"/>
  </g>

  <rect x="60" y="350" width="1080" height="44" rx="12" fill="#0c4a6e" opacity=".7"/>
  <text x="600" y="379" text-anchor="middle" fill="#e0f2fe" font-size="18" font-family="Arial, sans-serif">Best Repair delivers only results that pass format, speech, spectrum, gain, and independent pair guards</text>
</svg>
