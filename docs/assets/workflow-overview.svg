<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Audio-sound 中文口播工作流概览</title>
  <desc id="desc">从原始素材、诊断分析、修音处理、删词接缝，到质量验证与 WAV/MP3 交付的完整流程。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".32"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <circle cx="1090" cy="72" r="150" fill="#2563eb" opacity=".12"/>
  <circle cx="90" cy="390" r="170" fill="#0ea5e9" opacity=".08"/>

  <text x="60" y="68" fill="#f8fafc" font-size="34" font-weight="700" font-family="Microsoft YaHei, 'Noto Sans SC', Arial, sans-serif">Audio-sound 中文口播工作流</text>
  <text x="60" y="103" fill="#94a3b8" font-size="19" font-family="Microsoft YaHei, 'Noto Sans SC', Arial, sans-serif">修音降噪 · 删词删句 · 接缝修复 · 质量验证与交付</text>
  <rect x="60" y="124" width="1080" height="4" rx="2" fill="url(#accent)"/>

  <g filter="url(#shadow)" font-family="Microsoft YaHei, 'Noto Sans SC', Arial, sans-serif">
    <g transform="translate(60 168)">
      <rect width="190" height="154" rx="18" fill="#1e293b" stroke="#334155"/>
      <circle cx="34" cy="34" r="18" fill="#0ea5e9"/>
      <text x="34" y="41" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">1</text>
      <text x="24" y="78" fill="#f8fafc" font-size="23" font-weight="700">原始素材</text>
      <text x="24" y="110" fill="#94a3b8" font-size="17">WAV / MP3 / 视频</text>
      <text x="24" y="136" fill="#94a3b8" font-size="17">保留采样率与声道</text>
    </g>

    <g transform="translate(280 168)">
      <rect width="190" height="154" rx="18" fill="#1e293b" stroke="#334155"/>
      <circle cx="34" cy="34" r="18" fill="#0284c7"/>
      <text x="34" y="41" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">2</text>
      <text x="24" y="78" fill="#f8fafc" font-size="23" font-weight="700">诊断分析</text>
      <text x="24" y="110" fill="#94a3b8" font-size="17">底噪 / 呼吸 / 削波</text>
      <text x="24" y="136" fill="#94a3b8" font-size="17">规划安全候选</text>
    </g>

    <g transform="translate(500 168)">
      <rect width="200" height="154" rx="18" fill="#1e293b" stroke="#334155"/>
      <circle cx="34" cy="34" r="18" fill="#2563eb"/>
      <text x="34" y="41" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">3</text>
      <text x="24" y="78" fill="#f8fafc" font-size="23" font-weight="700">修音处理</text>
      <text x="24" y="110" fill="#94a3b8" font-size="17">呼吸 / 均衡 / 去齿音</text>
      <text x="24" y="136" fill="#94a3b8" font-size="17">稳量 / 降噪 / 保护</text>
    </g>

    <g transform="translate(730 168)">
      <rect width="190" height="154" rx="18" fill="#1e293b" stroke="#334155"/>
      <circle cx="34" cy="34" r="18" fill="#4f46e5"/>
      <text x="34" y="41" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">4</text>
      <text x="24" y="78" fill="#f8fafc" font-size="23" font-weight="700">删词接缝</text>
      <text x="24" y="110" fill="#94a3b8" font-size="17">删字 / 删句 / 废句</text>
      <text x="24" y="136" fill="#94a3b8" font-size="17">淡化 / 安全停顿</text>
    </g>

    <g transform="translate(950 168)">
      <rect width="190" height="154" rx="18" fill="#1e293b" stroke="#334155"/>
      <circle cx="34" cy="34" r="18" fill="#7c3aed"/>
      <text x="34" y="41" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">5</text>
      <text x="24" y="78" fill="#f8fafc" font-size="23" font-weight="700">验证交付</text>
      <text x="24" y="110" fill="#94a3b8" font-size="17">质量守门 / SHA-256</text>
      <text x="24" y="136" fill="#94a3b8" font-size="17">WAV + MP3 + 报告</text>
    </g>
  </g>

  <g fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round">
    <path d="M252 245h20"/>
    <path d="M472 245h20"/>
    <path d="M702 245h20"/>
    <path d="M922 245h20"/>
  </g>
  <g fill="#94a3b8">
    <path d="M272 245l-9-6v12z"/>
    <path d="M492 245l-9-6v12z"/>
    <path d="M722 245l-9-6v12z"/>
    <path d="M942 245l-9-6v12z"/>
  </g>

  <rect x="60" y="350" width="1080" height="44" rx="12" fill="#0c4a6e" opacity=".7"/>
  <text x="600" y="379" text-anchor="middle" fill="#e0f2fe" font-size="18" font-family="Microsoft YaHei, 'Noto Sans SC', Arial, sans-serif">最佳修复只交付通过格式、语音、频谱、增益与独立对比守门的结果</text>
</svg>
